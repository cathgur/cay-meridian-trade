name: Connect Cay Meridian WhatsApp

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  connect-whatsapp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect WhatsApp links
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          whatsapp_url = "https://wa.me/8619150036874?text=Hi%20Cay%20Meridian%20Trade%2C%20I%27d%20like%20help%20sourcing%20a%20product%20from%20China."

          html, count = re.subn(
              r'<a\s+href="#"([^>]*class="[^"]*cm-whatsapp-link[^"]*"[^>]*)>',
              lambda m: '<a href="' + whatsapp_url + '"' + m.group(1) + '>',
              html,
          )

          if "cm-whatsapp-float" not in html:
              floating_button = '''
          <a href="''' + whatsapp_url + '''" class="cm-whatsapp-float" target="_blank" rel="noopener" aria-label="Chat with Cay Meridian Trade on WhatsApp">
              <i class="fa fa-whatsapp"></i>
          </a>
          <style>
              .cm-whatsapp-float {
                  position: fixed;
                  right: 24px;
                  bottom: 24px;
                  width: 58px;
                  height: 58px;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  border-radius: 50%;
                  background: #25D366;
                  color: #fff !important;
                  font-size: 28px;
                  text-decoration: none !important;
                  box-shadow: 0 5px 18px rgba(0,0,0,.25);
                  z-index: 99999;
                  transition: transform .2s ease, box-shadow .2s ease;
              }
              .cm-whatsapp-float:hover {
                  transform: translateY(-3px) scale(1.04);
                  box-shadow: 0 8px 24px rgba(0,0,0,.3);
              }
              @media (max-width: 767px) {
                  .cm-whatsapp-float {
                      right: 16px;
                      bottom: 16px;
                      width: 54px;
                      height: 54px;
                      font-size: 25px;
                  }
              }
          </style>
          '''
              html = html.replace("</body>", floating_button + "\n</body>", 1)

          path.write_text(html, encoding="utf-8")
          print(f"Updated {count} WhatsApp link(s).")
          PY

      - name: Commit website changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Connect website to Cay Meridian WhatsApp"
            git push
          fi
